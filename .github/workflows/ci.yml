name: Hexacore CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Linter
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Next.js Production App
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Mock environment variables needed during build
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "https://mockproject.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mockanonkey"
          SUPABASE_SERVICE_ROLE_KEY: "mockservicekey"
          GEMINI_API_KEY: "mockgeminikey"
